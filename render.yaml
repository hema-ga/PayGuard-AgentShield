services:
  - type: web
    name: payguard-judge-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python PayGuard-Production-Build/gateway_server.py
    healthCheckPath: /_gateway/status
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
